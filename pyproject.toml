[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archaeocode"
version = "0.1.0"
description = "Excavate the ancient history buried in any git repository"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["git", "archaeology", "visualization", "cli", "history", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
archaeocode = "archaeocode.cli:cli"

[project.urls]
Homepage = "https://github.com/JipSanders/archaeocode"
Repository = "https://github.com/JipSanders/archaeocode"
Issues = "https://github.com/JipSanders/archaeocode/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["archaeocode*"]

[tool.ruff]
line-length = 100
target-version = "py310"
